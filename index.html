<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Random Place</title>
<style>
body{
    background:#000;
    color:#00ff88;
    font-family:monospace;
    padding:20px;
}
</style>
</head>
<body>

<pre id="text">Loading...</pre>

<script>

async function start() {

    function randomLat() {
        return (Math.random() * 120 - 60);
    }

    function randomLng() {
        return (Math.random() * 360 - 180);
    }

    while(true){

        let lat = randomLat();
        let lng = randomLng();

        try {

            let res = await fetch(
                `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`
            );

            let data = await res.json();

            if(!data.address) continue;

            let addr = data.address;

            if(!(addr.city || addr.town || addr.village)) continue;

            let placeName = (addr.city || addr.town || addr.village) +
                            (addr.country ? ", " + addr.country : "");

            let banned = ["Desert","Ocean","Sea","Ice","Antarctica","Greenland"];

            if(banned.some(word => placeName.includes(word))) continue;

            let imageUrl = `https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=${lng-0.05},${lat-0.05},${lng+0.05},${lat+0.05}&bboxSR=4326&size=600,400&format=png&f=image`;

            let output = `name="${placeName}", png="${imageUrl}"`;

            document.body.innerText = output;

            break;

        } catch(e){
            continue;
        }
    }
}

start();

</script>

</body>
</html>
